syntax = "proto3";

package users;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/mihnpro/Merch_shop/services/user_customer/contracts/gen/go/userpb;userpb";

// User Service — аутентификация, профиль, баланс баллов, админ-методы.
service UserService {
    rpc GetUser(google.protobuf.Empty) returns (User);
    rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty);

    rpc GetBalance(google.protobuf.Empty) returns (Balance);
    rpc DeductPoints(DeductPointsRequest) returns (Balance);
    rpc AddPoints(AddPointsRequest) returns (Balance);

    rpc GrantPoints(GrantPointsRequest) returns (Balance);
    rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
    rpc BlockUser(BlockUserRequest) returns (User);
    rpc ChangeRole(ChangeRoleRequest) returns (User);
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
    rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
}

// Статус учётной записи.
enum UserStatus {
    USER_STATUS_UNSPECIFIED = 0;
    USER_STATUS_ACTIVE      = 1;
    USER_STATUS_BLOCKED     = 2;
}

// Роль пользователя.
message Role {
    string id          = 1;
    string code        = 2;
    string name        = 3;
    string description = 4;
}

// Публичные данные пользователя (без секретов).
message User {
    string id           = 1;
    string login        = 2;
    string first_name   = 3;
    string last_name    = 4;
    string patronymic   = 5;
    string email        = 6;
    string phone_number = 7;
    Role   role         = 8;
    UserStatus status   = 9;
    google.protobuf.Timestamp last_login_at = 10;
    google.protobuf.Timestamp created_at    = 11;
    google.protobuf.Timestamp updated_at    = 12;
}

// Пара JWT-токенов.
message TokenPair {
    string access_token                          = 1;
    string refresh_token                         = 2;
    google.protobuf.Timestamp access_expires_at  = 3;
    google.protobuf.Timestamp refresh_expires_at = 4;
}

// Текущий баланс баллов.
message Balance {
    int64 points                         = 1;
    google.protobuf.Timestamp updated_at = 2;
}

// Запись истории операций по баллам.
message PointsTransaction {
    string id                            = 1;
    string user_id                       = 2;
    string operation_id                  = 3;
    string order_id                      = 4;
    int64  amount                        = 5;
    string reason                        = 6;
    google.protobuf.Timestamp created_at = 7;
}

// Регистрация нового сотрудника.
message RegisterRequest {
    string login        = 1;
    string password     = 2;
    string first_name   = 3;
    string last_name    = 4;
    string patronymic   = 5;
    string email        = 6;
    string phone_number = 7;
}

// Вход по логину и паролю.
message LoginRequest {
    string login    = 1;
    string password = 2;
}

// Ответ Register / Login.
message AuthResponse {
    User      user   = 1;
    TokenPair tokens = 2;
}

// Обмен refresh-токена на новую пару.
message RefreshRequest {
    string refresh_token = 1;
}

// Отзыв refresh-токена.
message LogoutRequest {
    string refresh_token = 1;
}

// Смена своего пароля.
message ChangePasswordRequest {
    string old_password = 1;
    string new_password = 2;
}

// Списание баллов (от Order при CreateOrder). Идемпотентно по operation_id.
message DeductPointsRequest {
    string user_id      = 1;
    int64  amount       = 2;
    string operation_id = 3;
    string order_id     = 4;
    string reason       = 5;
}

// Начисление баллов (служебное, от Order при компенсации). Идемпотентно по operation_id.
message AddPointsRequest {
    string user_id      = 1;
    int64  amount       = 2;
    string operation_id = 3;
    string order_id     = 4;
    string reason       = 5;
}

// Админское начисление баллов. Идемпотентно по operation_id.
message GrantPointsRequest {
    string user_id      = 1;
    int64  amount       = 2;
    string operation_id = 3;
    string reason       = 4;
    bool   confirmed    = 5;
}

// Сброс пароля сотруднику админом.
message ResetPasswordRequest {
    string user_id = 1;
}

// Новый одноразовый пароль; показывается админу один раз.
message ResetPasswordResponse {
    string new_password = 1;
}

// Блокировка или разблокировка учётки.
message BlockUserRequest {
    string     user_id    = 1;
    UserStatus new_status = 2;
    string     reason     = 3;
}

// Смена роли пользователя.
message ChangeRoleRequest {
    string user_id   = 1;
    string role_code = 2;
}

// Список пользователей с поиском и фильтрами.
message ListUsersRequest {
    string     search     = 1;
    string     role_code  = 2;
    UserStatus status     = 3;
    int32      page_size  = 4;
    string     page_token = 5;
}

// Страница списка пользователей.
message ListUsersResponse {
    repeated User users           = 1;
    string        next_page_token = 2;
}

// История операций по баллам пользователя (self или admin-only).
message GetTransactionsRequest {
    string user_id    = 1;
    int32  page_size  = 2;
    string page_token = 3;
}

// Страница истории операций.
message GetTransactionsResponse {
    repeated PointsTransaction transactions    = 1;
    string                     next_page_token = 2;
}
