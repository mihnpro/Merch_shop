services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merch_order}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-merch_order}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.24.1
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: >-
        host=postgres port=5432
        user=${POSTGRES_USER:-postgres}
        password=${POSTGRES_PASSWORD}
        dbname=${POSTGRES_DB:-merch_order}
        sslmode=disable
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # Persist logs + consumer offsets so a broker recreation (every order:up
      # rebuilds this service) does NOT drop already-published outbox events.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - default
      - shared

  order:
    build:
      context: ..
      dockerfile: order/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-merch_order}
      POSTGRES_SSLMODE: disable
      CART_SERVICE_ADDR: ${CART_SERVICE_ADDR:-cart:50055}
      USER_SERVICE_ADDR: ${USER_SERVICE_ADDR:-user:50051}
      INVENTORY_SERVICE_ADDR: ${INVENTORY_SERVICE_ADDR:-inventory:50051}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      GRPC_PORT: ${GRPC_PORT:-50056}
      HTTP_PORT: ${HTTP_PORT:-8086}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "50056:50056"
      - "${HTTP_PORT:-8086}:8086"
    networks:
      - default
      - shared
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:

networks:
  shared:
    external: true
    name: user_default
