openapi: 3.0.3
info:
  title: User Service — Public API
  description: >-
    Публичные HTTP-эндпоинты user-сервиса, доступные клиентам через gateway.
    Приватные межсервисные методы описаны gRPC-контрактом в ../AccountInternal/users.proto.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Базовый префикс (gateway проксирует по нему в user-сервис)

tags:
  - name: auth
    description: Регистрация и управление сессией
  - name: profile
    description: Данные текущего пользователя

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Логин уже занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      summary: Вход (выдаёт пару токенов)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновление пары токенов по refresh-токену
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Отзыв refresh-токена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Сессия завершена
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [profile]
      summary: Текущий пользователь (из access-токена)
      responses:
        "200":
          description: Идентичность из токена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Некорректный запрос / ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Невалидные учётные данные или токен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    RegisterRequest:
      type: object
      required: [login, password, first_name, last_name, email]
      properties:
        login: { type: string }
        password: { type: string, minLength: 8 }
        first_name: { type: string }
        last_name: { type: string }
        patronymic: { type: string }
        email: { type: string, format: email }
        phone_number: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        patronymic: { type: string }
        email: { type: string, format: email }
        phone_number: { type: string }

    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/Tokens"

    Me:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

security:
  - bearerAuth: []
