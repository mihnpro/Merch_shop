openapi: 3.0.3
info:
  title: User Service — Public API
  description: >-
    Публичные HTTP-эндпоинты user-сервиса, доступные клиентам через gateway.

    Аутентификация — на HttpOnly-куках: `/auth/login` и `/auth/refresh` выдают
    `access_token` и `refresh_token` через заголовок `Set-Cookie`, токены в теле
    ответа не возвращаются. Gateway извлекает cookie `access_token` и проставляет
    бэкендам заголовок `Authorization: Bearer <token>` (поэтому допустим и прямой
    вызов с Bearer-заголовком). `refresh_token` ограничен путём `/api/v1/auth`.

    Приватные межсервисные методы описаны gRPC-контрактом в
    ../AccountInternal/users.proto.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Базовый префикс (gateway проксирует по нему в user-сервис)

tags:
  - name: auth
    description: Регистрация и управление сессией
  - name: profile
    description: Данные и баланс текущего пользователя
  - name: admin
    description: Управление пользователями и баллами (только role=admin)

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Логин уже занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      summary: Вход (выставляет cookie-сессию)
      description: >-
        При успехе выставляет HttpOnly-куки `access_token` и `refresh_token`
        через `Set-Cookie`. Тело ответа содержит только профиль пользователя.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешный вход
          headers:
            Set-Cookie:
              description: >-
                Две куки: `access_token` (path=/) и `refresh_token`
                (path=/api/v1/auth), обе HttpOnly.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновление пары токенов по refresh-куке
      description: >-
        Читает `refresh_token` из куки (тело запроса не требуется), ротирует
        пару токенов и выставляет новые куки через `Set-Cookie`.
      security: []
      responses:
        "204":
          description: Куки обновлены (тело пустое)
          headers:
            Set-Cookie:
              description: Новые `access_token` и `refresh_token`.
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Завершение сессии
      description: >-
        Отзывает `refresh_token` (если кука присутствует) и очищает обе
        auth-куки. Идемпотентно: вызывается без активной сессии.
      security: []
      responses:
        "204":
          description: Сессия завершена, куки очищены

  /me:
    get:
      tags: [profile]
      summary: Текущий пользователь (из access-токена)
      responses:
        "200":
          description: Идентичность из токена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/profile:
    get:
      tags: [profile]
      summary: Полный профиль текущего пользователя
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [profile]
      summary: Редактирование собственных данных профиля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    post:
      tags: [profile]
      summary: Смена собственного пароля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Пароль изменён
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Неверен старый пароль или сессия
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/balance:
    get:
      tags: [profile]
      summary: Баланс баллов текущего пользователя
      responses:
        "200":
          description: Текущий баланс
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/transactions:
    get:
      tags: [profile]
      summary: История операций по баллам текущего пользователя
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Страница транзакций
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/users:
    get:
      tags: [admin]
      summary: Список пользователей с фильтрами и пагинацией по токену
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Поиск по логину/email/имени/фамилии }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" }, description: Фильтр по роли }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" }, description: Фильтр по статусу }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Страница пользователей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/stats:
    get:
      tags: [admin]
      summary: Статистика пользователей за период (новые сотрудники)
      parameters:
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: Статистика
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{id}:
    get:
      tags: [admin]
      summary: Карточка пользователя по идентификатору
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/grant-points:
    post:
      tags: [admin]
      summary: Начислить баллы пользователю
      description: >-
        Идемпотентно по `operation_id`: повторный запрос с тем же ключом
        вернёт текущий баланс, не начисляя повторно.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPointsRequest"
      responses:
        "200":
          description: Обновлённый баланс
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/reset-password:
    post:
      tags: [admin]
      summary: Сбросить пароль пользователя
      description: Генерирует новый пароль и возвращает его одноразово в ответе.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Новый пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/status:
    put:
      tags: [admin]
      summary: Заблокировать / разблокировать пользователя
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserRequest"
      responses:
        "200":
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/role:
    put:
      tags: [admin]
      summary: Сменить роль пользователя
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
      responses:
        "200":
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{id}/transactions:
    get:
      tags: [admin]
      summary: История операций по баллам пользователя
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Страница транзакций
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
    PageToken:
      name: page_token
      in: query
      schema: { type: string }
      description: Токен следующей страницы; пусто, если страница последняя
    Period:
      name: period
      in: query
      schema: { type: string, enum: [day, week, month], default: day }
      description: Период агрегации; по умолчанию day

  responses:
    BadRequest:
      description: Некорректный запрос / ошибка валидации
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Отсутствует или невалиден токен/сессия
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Недостаточно прав (требуется role=admin)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Role:
      type: string
      enum: [user, admin]
    Status:
      type: string
      enum: [active, blocked]

    RegisterRequest:
      type: object
      required: [login, password, first_name, last_name, email]
      properties:
        login: { type: string }
        password: { type: string, minLength: 8 }
        first_name: { type: string }
        last_name: { type: string }
        patronymic: { type: string }
        email: { type: string, format: email }
        phone_number: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        patronymic: { type: string }
        email: { type: string, format: email }
        phone_number: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/Status" }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    Me:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }

    Balance:
      type: object
      properties:
        points: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        amount:
          type: integer
          format: int64
          description: Положительное при начислении, отрицательное при списании
        reason: { type: string }
        created_at: { type: string, format: date-time }

    TransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        next_page_token:
          type: string
          description: Токен следующей страницы; пусто, если страница последняя

    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_page_token:
          type: string
          description: Токен следующей страницы; пусто, если страница последняя

    GrantPointsRequest:
      type: object
      required: [amount, operation_id]
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        operation_id:
          type: string
          format: uuid
          description: Идемпотентный ключ операции
        reason: { type: string }

    BlockUserRequest:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }
        reason: { type: string }

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    ResetPasswordResponse:
      type: object
      properties:
        new_password: { type: string }

    UpdateProfileRequest:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        patronymic: { type: string }
        email: { type: string, format: email }
        phone_number: { type: string }

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 8 }

    UsersStatsResponse:
      type: object
      properties:
        new_users:
          type: integer
          description: Число пользователей, зарегистрированных за период

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

security:
  - cookieAuth: []
