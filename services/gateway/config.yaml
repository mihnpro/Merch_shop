services:
  user: http://user:8081

routes:
  - prefix: /api/v1/auth/login
    service: user
    public: true
  - prefix: /api/v1/auth/register
    service: user
    public: true
  - prefix: /api/v1/auth/refresh
    service: user
    public: true
  - prefix: /api/v1/auth
    service: user
  - prefix: /api/v1/me
    service: user
