services:
  user: http://user:8081
  product: http://product:8082
  media: http://media:8083
  inventory: http://inventory:8084

routes:
  - prefix: /api/v1/auth/*
    service: user
    public: true
  - prefix: /api/v1/me
    service: user


  - prefix: /api/v1/products
    service: product
  - prefix: /api/v1/categories
    service: product


  - prefix: /api/v1/admin/products
    service: product
  - prefix: /api/v1/admin/categories
    service: product


  - prefix: /api/v1/admin/media
    service: media

  - prefix: /api/v1/admin/inventory
    service: inventory
