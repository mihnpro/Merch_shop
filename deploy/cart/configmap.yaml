apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-config
  namespace: merchshop
  labels:
    app: cart
data:
  POSTGRES_HOST: "host.minikube.internal"
  POSTGRES_PORT: "5433"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "merch_cart"
  POSTGRES_SSLMODE: "disable"
  GRPC_PORT: "50055"
  HTTP_PORT: "8085"
  REDIS_ADDR: "host.minikube.internal:6379"
  PRODUCT_SERVICE_ADDR: "product:50051"
  INVENTORY_SERVICE_ADDR: "inventory:50051"
