apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: merchshop
  labels:
    app: cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart
          image: cart:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
            - name: grpc
              containerPort: 50055
          envFrom:
            - configMapRef:
                name: cart-config
            - secretRef:
                name: cart-secrets
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
