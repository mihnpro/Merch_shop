apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: merchshop
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: GATEWAY_CONFIG
              value: /etc/gateway/config.yaml
            - name: HTTP_READ_TIMEOUT
              value: 60s
            - name: HTTP_WRITE_TIMEOUT
              value: 60s
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-secrets
                  key: JWT_ACCESS_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/gateway/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: gateway-config
